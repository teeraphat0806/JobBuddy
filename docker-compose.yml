# Local development database only. On Railway, use the managed Postgres service.
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: jobbuddy
      POSTGRES_PASSWORD: jobbuddy
      POSTGRES_DB: jobbuddy
      TZ: Asia/Bangkok
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U jobbuddy']
      interval: 5s
      retries: 10

volumes:
  pgdata:
